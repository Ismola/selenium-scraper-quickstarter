services:
  server:
    image: ghcr.io/ismola/selenium-scraper-quickstarter:main
    pull_policy: always
    init: true
    shm_size: "2gb"
    ports:
      - 3000:3000
      - 127.0.0.1:${METRICS_PORT:-9090}:9090
    container_name: selenium-scraper-quickstarter
    volumes:
      - ./temp_downloads:/app/temp_downloads
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - STAGE=${STAGE:-production}
      - VALID_TOKEN=${VALID_TOKEN:?VALID_TOKEN must be set}
      - HEADLESS_MODE=${HEADLESS_MODE:-auto}
      - SELENIUM_STEALTH=${SELENIUM_STEALTH:-true}
      - BROWSER_LANGUAGE=${BROWSER_LANGUAGE:-en}
      - DOWNLOAD_DIR=${DOWNLOAD_DIR:-temp_downloads}
      - PAGE_MAX_TIMEOUT=${PAGE_MAX_TIMEOUT:-7}
      - WEBDRIVER_COMMAND_TIMEOUT=${WEBDRIVER_COMMAND_TIMEOUT:-60}
      - PAGE_LOAD_TIMEOUT=${PAGE_LOAD_TIMEOUT:-60}
      - SCRIPT_TIMEOUT=${SCRIPT_TIMEOUT:-30}
      - WEBDRIVER_MAX_LIFETIME=${WEBDRIVER_MAX_LIFETIME:-720}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-100}
      - DOWNLOAD_MAX_TIMEOUT=${DOWNLOAD_MAX_TIMEOUT:-4}
      - BASE_URL=${BASE_URL:-https://www.google.com/}
      - METRICS_PORT=9090
      - SCRAPER_SERVICE_NAME=${SCRAPER_SERVICE_NAME:-selenium-scraper-quickstarter}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-10485760}
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: requirements.txt
